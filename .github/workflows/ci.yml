name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test the CLI and the example app
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          printf '2\n' | node examples/paybank.mjs --simulate | grep -q "Your balance is"
          printf '4\n9\n2\n' | node examples/paybank.mjs --simulate | grep -q "You chose Opay"
